name: Validate pull request

# PR gate. Nothing here touches a shared org: Apex runs in a throw-away scratch org per PR, so concurrent
# pull requests cannot overwrite each other's metadata. Release validation against production lives in deploy.yml.

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'force-app/**'
      - 'revops-lab/**'
      - 'config/**'
      - 'scripts/**'
      - 'sfdx-project.json'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SF_CLI_VERSION: '2'
  NODE_VERSION: '20'

jobs:
  static-checks:
    name: Lint, format, unit tests, static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint (LWC)
        run: npm run lint
      - name: Prettier (Apex, triggers, LWC)
        run: npm run prettier:verify
      - name: LWC unit tests (Jest, coverage gate in jest.config.js)
        run: npm run test:unit:coverage
      - name: Persona FLS consistency (every USER_MODE query is readable by the personas that call it)
        run: npm run check:fls
      - name: Metadata XML in schema order
        run: npm run check:metadata-order
      - name: RevOps Lab permission sets match the generator
        run: |
          npm run generate:lab-security
          git diff --exit-code -- revops-lab/main/default/permissionsets revops-lab/main/default/permissionsetgroups docs/revops-lab/FIELD-LEVEL-SECURITY.md
      - name: Static analysis (PMD via Salesforce Code Analyzer)
        run: |
          npm install --global @salesforce/cli@${SF_CLI_VERSION}
          sf plugins install code-analyzer
          sf code-analyzer run --workspace force-app --workspace revops-lab \
            --rule-selector pmd:Security --rule-selector pmd:ErrorProne \
            --severity-threshold 2 --output-file code-analyzer.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-reports
          path: |
            coverage/
            code-analyzer.html
          if-no-files-found: ignore

  apex-tests:
    name: Deploy to a scratch org and run Apex tests
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 60
    environment: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/sf-setup
        with:
          auth-url: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
          alias: devhub
          set-default-dev-hub: 'true'
      - name: Create scratch org
        run: |
          sf org create scratch --definition-file config/project-scratch-def.json \
            --alias ci-scratch --duration-days 1 --wait 20 --target-dev-hub devhub
      - name: Deploy source (main layer and RevOps Lab)
        run: sf project deploy start --source-dir force-app --source-dir revops-lab --target-org ci-scratch --wait 30
      - name: Run local Apex tests with coverage
        run: |
          sf apex run test --test-level RunLocalTests --code-coverage --result-format human \
            --output-dir test-results --target-org ci-scratch --wait 40
      - name: Coverage gate (per class and overall)
        run: python3 scripts/ci/check_coverage.py test-results --min-class 85 --min-overall 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-test-results
          path: test-results
          if-no-files-found: ignore
      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --target-org ci-scratch --no-prompt || true
